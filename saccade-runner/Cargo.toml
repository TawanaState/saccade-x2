[package]
name = "saccade-runner"
version = "0.1.0"
edition = "2021"

[lib]
name = "saccade_runner"
path = "src/lib.rs"

[dependencies]
candle-core = "0.4.1"
candle-nn = "0.4.1"
candle-transformers = "0.4.1"
saccade-core = { path = "../saccade-core" }
hf-hub = "0.3.2"
half = "2.3.1"
clap = { version = "4", features = ["derive"] }
tokenizers = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "saccade-compile"
path = "src/bin/compile.rs"

[[bin]]
name = "saccade-run"
path = "src/bin/run.rs"

[[bin]]
name = "qwen_example"
path = "src/bin/qwen_example.rs"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"
